[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "god_stack"
version = "1.0.0"
description = "Matrix Orchestration Framework"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
godctl = "god_stack.cli.godctl:main"

[tool.setuptools.packages.find]
where = ["src"]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "god-stack"
version = "2.2.0"
description = "G.O.D. Stack — Global Orchestration Daemon Stack"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "tangleroot013"}]
keywords = ["daemon", "orchestration", "web-scraping", "clustering", "prometheus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "flake8>=6.0",
    "mypy>=1.0",
    "black>=23.0",
]

[project.urls]
Repository = "https://github.com/tangleroot013/god_stack"
Issues = "https://github.com/tangleroot013/god_stack/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py311"]
